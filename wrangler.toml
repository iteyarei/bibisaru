# Cloudflare Pages. Dashboard build uses the same output directory.
# Coupang product search needs Pages secrets COUPANG_ACCESS_KEY and COUPANG_SECRET_KEY.
# Without them, 酷澎 shows 暫時無法取得 and the affiliate search link.
name = "bibisaru"
compatibility_date = "2026-10-12"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"
